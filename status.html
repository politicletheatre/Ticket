<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c83e29" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>🎫 ตรวจสอบสถานะบัตร — น่าจะรู้อย่างนี้ตั้งแต่ปี 2475 NO TIME TO BLIND</title>
  <meta name="description" content="ตรวจสอบสถานะบัตรและ QR Code ของคุณสำหรับการแสดง น่าจะรู้อย่างนี้ตั้งแต่ปี 2475 NO TIME TO BLIND" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="assets/qrcodejs.min.js"></script>
  <style>
    /* ============================================================
       WARM RETRO POSTER THEME (สีสดใสน่ารักตามโปสเตอร์ 2475)
       ============================================================ */
    :root {
      --bg: #fbf8f1;                      /* Warm cream poster paper */
      --surface: #ffffff;                 /* Cards: pure white */
      --surface-sub: #fdfbf7;             /* Soft parchment */
      --border: rgba(40, 107, 110, 0.18);   /* Vintage teal border */
      --border-light: rgba(40, 107, 110, 0.1);
      --primary: #c83e29;                 /* 2475 Terracotta Red */
      --primary-light: #e06d44;           /* Coral Orange */
      --teal: #286b6e;                    /* 1930s Vintage Teal */
      --teal-light: #36888c;
      --teal-bg: rgba(40, 107, 110, 0.08);
      --success: #15803d;
      --error: #dc2626;
      --warning: #b45309;
      --text: #1c1917;                    /* Dark charcoal */
      --text-sub: #44403c;
      --muted: #78716c;                   /* Muted stone */
      --radius: 18px;
      --shadow-sm: 0 2px 8px rgba(40, 107, 110, 0.06);
      --shadow-md: 0 6px 24px rgba(40, 107, 110, 0.08);
      --shadow-red: 0 4px 18px rgba(200, 62, 41, 0.25);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .status-header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(90deg, #c83e29 0%, #e06d44 35%, #286b6e 100%) !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-logo {
      font-size: 1.05rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px;
      color: #ffffff;
      text-decoration: none;
    }
    .logo-emoji {
      font-size: 1.25rem;
      display: inline-block;
    }
    .logo-text {
      color: #ffffff;
      display: inline-block;
      letter-spacing: 0.2px;
    }
    .logo-short { display: none; }
    .header-nav a {
      color: #ffffff !important; font-size: 0.85rem; text-decoration: none;
      padding: 6px 16px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 50px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      transition: var(--transition);
      display: inline-flex; align-items: center; gap: 6px;
      font-weight: 600;
    }
    .header-nav a:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      .status-header { padding: 10px 14px; }
      .header-logo { font-size: 0.92rem; }
      .logo-full { display: none; }
      .logo-short { display: inline; }
      .header-nav a { font-size: 0.8rem; padding: 5px 12px; }
    }

    /* ── MAIN ── */
    .status-main { max-width: 600px; margin: 0 auto; padding: 32px 16px 80px; }

    /* ── HERO ── */
    .status-hero { text-align: center; margin-bottom: 28px; }
    .status-hero-icon {
      font-size: 3.2rem; margin-bottom: 10px;
      display: inline-block;
      filter: drop-shadow(0 4px 12px rgba(200, 62, 41, 0.2));
    }
    .status-hero h1 {
      font-size: 1.7rem; font-weight: 700; color: #1c1917; margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .status-hero p {
      font-size: 0.92rem; color: #57534e; line-height: 1.6;
    }

    /* ── SEARCH BOX ── */
    .search-card {
      background: #ffffff; border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      box-shadow: 0 8px 30px rgba(40, 107, 110, 0.08);
      margin-bottom: 24px;
    }
    .search-title {
      font-size: 0.85rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--teal); margin-bottom: 16px;
      display: flex; align-items: center; gap: 6px;
    }
    .search-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .search-tab {
      flex: 1; padding: 11px 12px; border-radius: 12px;
      border: 1.5px solid rgba(40, 107, 110, 0.2);
      background: #fbf8f1; color: #57534e; font-family: inherit;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: var(--transition);
    }
    .search-tab:hover {
      background: rgba(200, 62, 41, 0.05);
      border-color: rgba(200, 62, 41, 0.3);
      color: var(--primary);
    }
    .search-tab.active {
      background: rgba(200, 62, 41, 0.1);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(200, 62, 41, 0.15);
    }
    .search-input-wrap { position: relative; }
    .search-input-wrap input {
      width: 100%; background: #ffffff; border: 1.5px solid rgba(40, 107, 110, 0.25);
      border-radius: 12px; padding: 13px 16px; color: #1c1917;
      font-family: inherit; font-size: 1rem; outline: none; transition: var(--transition);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
    }
    .search-input-wrap input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(40, 107, 110, 0.15);
    }
    .search-input-wrap input::placeholder { color: #a8a29e; }
    .btn-search {
      width: 100%; margin-top: 14px;
      background: linear-gradient(135deg, #c83e29 0%, #d9533c 50%, #e06d44 100%);
      color: #ffffff; border: none; border-radius: 12px;
      padding: 13px; font-family: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(200, 62, 41, 0.3);
    }
    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(200, 62, 41, 0.45);
    }
    .btn-search:active { transform: scale(0.98); }

    /* ── RESULT SECTION ── */
    #result-section { display: none; animation: fadeUp 0.35s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

    /* ── ORDER CARD (collapsed) ── */
    .order-card {
      background: #ffffff;
      border: 1.5px solid rgba(40, 107, 110, 0.2);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(40, 107, 110, 0.08);
      transition: var(--transition);
    }
    .order-card:hover {
      border-color: var(--teal);
      box-shadow: 0 8px 30px rgba(40, 107, 110, 0.14);
    }

    .order-card-header {
      padding: 20px 22px;
      cursor: default;
    }

    .order-card-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px dashed rgba(40, 107, 110, 0.15);
      padding-bottom: 12px;
    }
    .order-card-id {
      font-family: monospace; font-size: 0.85rem; font-weight: 700;
      background: rgba(40, 107, 110, 0.1); color: var(--teal);
      padding: 4px 10px; border-radius: 8px; letter-spacing: 0.5px;
      display: inline-block;
    }
    .order-card-date {
      font-size: 0.78rem; color: #78716c; margin-top: 4px;
    }
    .order-ticket-count {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(200, 62, 41, 0.1); border: 1px solid rgba(200, 62, 41, 0.25);
      color: var(--primary); border-radius: 50px;
      font-size: 0.8rem; font-weight: 700; padding: 4px 12px;
      white-space: nowrap; flex-shrink: 0;
    }

    .order-card-rows {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
    }
    .order-info-item { font-size: 0.85rem; }
    .order-info-item .oi-label { color: #78716c; font-size: 0.75rem; margin-bottom: 2px; }
    .order-info-item .oi-val { font-weight: 700; color: #1c1917; }

    .order-card-footer {
      padding: 0 22px 20px;
    }

    /* Expand button */
    .btn-expand-tickets {
      width: 100%;
      background: rgba(40, 107, 110, 0.08);
      border: 1.5px solid rgba(40, 107, 110, 0.25);
      border-radius: 12px;
      color: var(--teal);
      font-family: inherit; font-size: 0.92rem; font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-expand-tickets:hover {
      background: rgba(40, 107, 110, 0.16);
      border-color: var(--teal);
      color: #1b494b;
      transform: translateY(-1px);
    }
    .btn-expand-tickets .expand-arrow {
      transition: transform 0.3s ease;
      display: inline-block;
    }
    .btn-expand-tickets.open .expand-arrow { transform: rotate(180deg); }

    /* ── TICKETS PANEL (expandable) ── */
    .tickets-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .tickets-panel.open { max-height: 9999px; }
    .tickets-panel-inner {
      padding: 6px 20px 20px;
      background: #fbf8f1;
      border-top: 1px solid rgba(40, 107, 110, 0.12);
    }

    .tickets-panel-label {
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--teal);
      margin-bottom: 12px; padding-top: 14px;
    }

    /* ── INDIVIDUAL TICKET CARD ── */
    .ticket-status-card {
      background: #ffffff; border: 1.5px solid rgba(40, 107, 110, 0.18);
      border-radius: 16px; overflow: hidden; margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(40, 107, 110, 0.06);
    }
    .ticket-status-card:last-child { margin-bottom: 0; }

    .ticket-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; border-bottom: 1px solid rgba(40, 107, 110, 0.1);
      background: #fdfbf7;
    }
    .ticket-num-label { font-size: 0.78rem; font-weight: 600; color: #78716c; }
    .ticket-id-code { font-family: monospace; font-size: 0.75rem; font-weight: 700; color: var(--primary); margin-top: 2px; }

    .ticket-status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 700;
      white-space: nowrap;
    }
    .badge-checked   { background: rgba(21,128,61,0.12);  color: #15803d; border: 1px solid rgba(21,128,61,0.25); }
    .badge-pending   { background: rgba(217,119,6,0.12);  color: #b45309; border: 1px solid rgba(217,119,6,0.25); }
    .badge-cancelled { background: rgba(220,38,38,0.12);  color: #dc2626; border: 1px solid rgba(220,38,38,0.25); }

    .ticket-card-body { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .qr-wrap {
      background: #ffffff !important;
      border: 1.5px solid rgba(40, 107, 110, 0.2);
      border-radius: 14px;
      padding: 14px !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(40, 107, 110, 0.1);
      filter: none !important;
      color-scheme: light !important;
    }
    .qr-wrap canvas,
    .qr-wrap img {
      vertical-align: middle;
      background: #ffffff !important;
      filter: none !important;
      color-scheme: light !important;
    }
    .ticket-detail-rows { width: 100%; }
    .ticket-info-row { display: flex; justify-content: space-between;
      font-size: 0.85rem; padding: 7px 0; border-bottom: 1px solid rgba(40, 107, 110, 0.08); }
    .ticket-info-row:last-child { border-bottom: none; }
    .ticket-info-row .tl { color: #78716c; font-size: 0.8rem; }
    .ticket-info-row .tv { font-weight: 600; color: #1c1917; text-align: right; }

    .btn-download-qr {
      width: 100%; background: linear-gradient(135deg, #286b6e, #36888c);
      border: none;
      color: #ffffff; border-radius: 12px; padding: 11px;
      font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer;
      transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 4px 14px rgba(40, 107, 110, 0.25);
    }
    .btn-download-qr:hover {
      background: linear-gradient(135deg, #1f5658, #286b6e);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(40, 107, 110, 0.35);
    }
    .btn-regen-qr {
      margin-top: 6px;
      background: rgba(200, 62, 41, 0.08) !important;
      border: 1px solid rgba(200, 62, 41, 0.25) !important;
      color: #c83e29 !important;
      border-radius: 12px;
      padding: 10px;
      font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%;
    }
    .btn-regen-qr:hover {
      background: rgba(200, 62, 41, 0.16) !important;
      border-color: #c83e29 !important;
    }

    /* ── NOT FOUND ── */
    .not-found {
      text-align: center; padding: 48px 24px;
      background: #ffffff; border: 1.5px solid rgba(200, 62, 41, 0.2); border-radius: var(--radius);
      box-shadow: 0 6px 24px rgba(200, 62, 41, 0.06);
    }
    .not-found .nf-icon { font-size: 3rem; margin-bottom: 12px; }
    .not-found h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
    .not-found p { font-size: 0.9rem; color: #78716c; line-height: 1.6; }

    /* ── NOTE ── */
    .status-note {
      background: rgba(40, 107, 110, 0.07); border: 1px solid rgba(40, 107, 110, 0.2);
      border-radius: 12px; padding: 14px 18px; font-size: 0.85rem; color: #44403c;
      line-height: 1.6; display: flex; gap: 10px; align-items: flex-start; margin-top: 20px;
    }

    /* ── ERROR ── */
    .error-msg { color: #dc2626; font-size: 0.85rem; margin-top: 8px; display: none; font-weight: 600; }
    .error-msg.show { display: block; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: rgba(28, 25, 23, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff; padding: 12px 24px; border-radius: 50px; font-size: 0.88rem;
      font-weight: 500; z-index: 9999; backdrop-filter: blur(20px);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s; opacity: 0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25); white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(34,197,94,0.4); }
    .toast.error { border-color: rgba(239,68,68,0.4); }

    /* ── FOOTER ── */
    .status-footer { text-align: center; padding: 24px 20px; font-size: 0.82rem; color: #78716c; }
  </style>
</head>
<body>

<header class="status-header">
  <div class="header-logo">
    <span class="logo-emoji">🎭</span>
    <span class="logo-text logo-full">น่าจะรู้อย่างนี้ตั้งแต่ปี 2475 NO TIME TO BLIND</span>
    <span class="logo-text logo-short">NO TIME TO BLIND</span>
  </div>
  <nav class="header-nav">
    <a href="index.html">
      🏠 กลับหน้าหลัก
    </a>
  </nav>
</header>

<main class="status-main">

  <!-- HERO -->
  <div class="status-hero">
    <div class="status-hero-icon">🎫</div>
    <h1>ตรวจสอบสถานะบัตร</h1>
    <p>กรอกเบอร์โทรศัพท์หรือรหัสคำสั่งซื้อ<br/>เพื่อดูรายการสั่งซื้อและ QR Code บัตรของคุณ</p>
  </div>

  <!-- SEARCH -->
  <div class="search-card">
    <div class="search-title">🔍 ค้นหาบัตรของคุณ</div>
    <div class="search-tabs">
      <button class="search-tab active" id="tab-phone" onclick="switchTab('phone')">📞 เบอร์โทรศัพท์</button>
      <button class="search-tab" id="tab-order" onclick="switchTab('order')">📋 รหัสคำสั่งซื้อ</button>
    </div>
    <div class="search-input-wrap">
      <input type="tel" id="input-phone" placeholder="กรอกเบอร์โทรศัพท์"
             inputmode="numeric" onkeydown="if(event.key==='Enter') doSearch()" />
      <input type="text" id="input-order" placeholder="กรอกรหัสการจอง"
             style="display:none;text-transform:uppercase"
             onkeydown="if(event.key==='Enter') doSearch()" />
    </div>
    <div class="error-msg" id="error-msg">❌ กรุณากรอกข้อมูลให้ถูกต้อง</div>
    <button class="btn-search" onclick="doSearch()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      ค้นหาบัตร
    </button>
  </div>

  <!-- RESULT -->
  <div id="result-section"></div>

</main>

<footer class="status-footer">
  © 2026 Politicle Theatre. All rights reserved.
</footer>

<script>
// ⚠️ ใส่ URL ของ Google Apps Script ของคุณที่นี่ (ตรงกับใน app.js และ staff.html)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxeeLAYpMzpwMlp_o41YAON1IdBalgtFZqEyJ4z_R1UKUCypwQGutr7DgvMHZtCipT1xw/exec';

let currentTab = 'phone';

/* ── TAB SWITCH ── */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-phone').classList.toggle('active', tab === 'phone');
  document.getElementById('tab-order').classList.toggle('active', tab === 'order');
  document.getElementById('input-phone').style.display = tab === 'phone' ? 'block' : 'none';
  document.getElementById('input-order').style.display = tab === 'order' ? 'block' : 'none';
  document.getElementById('error-msg').classList.remove('show');
  document.getElementById('result-section').style.display = 'none';
  setTimeout(() => (tab === 'phone'
    ? document.getElementById('input-phone')
    : document.getElementById('input-order')).focus(), 50);
}

/* ── SEARCH ── */
async function doSearch() {
  const errEl = document.getElementById('error-msg');
  errEl.classList.remove('show');

  let query = '';
  if (currentTab === 'phone') {
    const rawVal = document.getElementById('input-phone').value.trim();
    query = cleanThaiPhone(rawVal);
    if (!query || !/^0\d{9}$/.test(query)) {
      errEl.textContent = '❌ กรุณากรอกเบอร์โทรศัพท์มือถือที่ถูกต้อง (เช่น 0812345678)';
      errEl.classList.add('show'); return;
    }
  } else {
    query = document.getElementById('input-order').value.trim().toUpperCase();
    if (!query) {
      errEl.textContent = '❌ กรุณากรอกรหัสคำสั่งซื้อ';
      errEl.classList.add('show'); return;
    }
  }

  const resultEl = document.getElementById('result-section');
  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <div style="text-align:center; padding:48px 24px; background:#ffffff; border:1.5px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-md);">
      <div style="font-size:2.5rem; margin-bottom:12px; animation: spin 1.5s linear infinite;">⏳</div>
      <h3 style="font-size:1.15rem; font-weight:700; color:#1c1917; margin-bottom:8px;">กำลังค้นหาตั๋วของคุณ...</h3>
      <p style="font-size:0.88rem; color:#78716c;">โปรดรอสักครู่ ระบบกำลังค้นหาข้อมูลความปลอดภัยบนคลาวด์</p>
    </div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  `;

  let allTickets = JSON.parse(localStorage.getItem('theater_tickets') || '{}');
  let allOrders  = JSON.parse(localStorage.getItem('theater_orders')  || '[]');

  // ฟังก์ชันล้างฟอร์แมตเบอร์โทรศัพท์ (ตัด 66 แทนที่ด้วย 0, เติม 0 ให้ครบ 10 หลักอัตโนมัติ)
  function cleanThaiPhone(p) {
    let s = String(p || '').trim().replace(/\D/g, '');
    if (s.startsWith('66')) {
      s = '0' + s.substring(2);
    }
    if (s.length === 9 && !s.startsWith('0')) {
      s = '0' + s;
    }
    return s;
  }

  // ฟังก์ชันสแกนหาใน localStorage ท้องถิ่น
  function findLocalMatchedIds() {
    const ids = new Set();
    if (currentTab === 'phone') {
      const qClean = cleanThaiPhone(query);
      Object.values(allTickets).forEach(t => {
        if (cleanThaiPhone(t.phone) === qClean)
          ids.add(t.orderId);
      });
    } else {
      Object.values(allTickets).forEach(t => {
        if ((t.orderId || '').toUpperCase().includes(query))
          ids.add(t.orderId);
      });
    }
    return ids;
  }

  let matchedOrderIds = new Set();
  let cloudSearched = false;

  // พยายามดึงข้อมูลจาก Sheets แบบ Real-time ตลอดเวลาหากมีการเชื่อมต่อคลาวด์ เพื่อความสอดคล้องสูงสุดข้ามอุปกรณ์
  if (typeof APPS_SCRIPT_URL !== 'undefined' && APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=searchOrder&query=${encodeURIComponent(query)}&type=${currentTab}`);
      if (res.ok) {
        const data = await res.json();
        if (data.success) {
          cloudSearched = true;
          if (data.orders && data.orders.length > 0) {
            // บันทึกแคชตั๋วรายใบ
            Object.assign(allTickets, data.tickets);
            localStorage.setItem('theater_tickets', JSON.stringify(allTickets));

            // บันทึกแคชคำสั่งซื้อ
            data.orders.forEach(newO => {
              const idx = allOrders.findIndex(o => o.orderId === newO.orderId);
              if (idx >= 0) allOrders[idx] = newO;
              else allOrders.push(newO);
            });
            localStorage.setItem('theater_orders', JSON.stringify(allOrders));

            matchedOrderIds = new Set(data.orders.map(o => o.orderId));
          } else {
            // บน Google Sheets ไม่พบข้อมูลนี้แล้ว (ถูกลบออกแล้ว)
            matchedOrderIds = new Set();
          }
        }
      }
    } catch (e) {
      console.warn('ดึงข้อมูลตั๋วผ่านคลาวด์ Sheets ไม่สำเร็จ (กำลังใช้ข้อมูลในเครื่องแทน):', e);
    }
  }

  // หากออฟไลน์หรือไม่สามารถติดต่อคลาวด์ได้ ให้ค้นหาในแคชเครื่องแทน
  if (!cloudSearched) {
    matchedOrderIds = findLocalMatchedIds();
  }

  if (matchedOrderIds.size === 0) {
    resultEl.innerHTML = `
      <div class="not-found">
        <div class="nf-icon">🔍</div>
        <h3>ไม่พบข้อมูลบัตร</h3>
        <p>ไม่พบบัตรที่ตรงกับข้อมูลที่กรอกในระบบ<br/>
        กรุณาตรวจสอบเบอร์โทรศัพท์/รหัสสั่งซื้ออีกครั้ง<br/>
        หรือหากโอนเงินแล้ว กรุณาติดต่อทีมงานเพื่อตรวจสอบครับ</p>
      </div>`;
    return;
  }

  // Sort orders newest first
  const sortedOrderIds = [...matchedOrderIds].sort((a, b) => {
    const tA = allOrders.find(o => o.orderId === a)?.timestamp || '';
    const tB = allOrders.find(o => o.orderId === b)?.timestamp || '';
    return tB.localeCompare(tA);
  });

  // Count results label
  const countLabel = sortedOrderIds.length === 1
    ? 'พบ 1 รายการสั่งซื้อ'
    : `พบ ${sortedOrderIds.length} รายการสั่งซื้อ`;

  let html = `<div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px;">${countLabel}</div>`;

  sortedOrderIds.forEach((orderId, orderIdx) => {
    const order = allOrders.find(o => o.orderId === orderId);
    const orderTickets = Object.values(allTickets)
      .filter(t => t.orderId === orderId)
      .sort((a, b) => a.ticketNum - b.ticketNum);

    if (!orderTickets.length) return;
    const rep = orderTickets[0];

    const totalAmt = rep.pricePerTicket
      ? rep.pricePerTicket * orderTickets.length
      : (order?.total || 0);

    const tsLabel = order?.timestamp
      ? new Date(order.timestamp).toLocaleDateString('th-TH', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        })
      : '—';

    // Check-in status summary
    const checkedCount   = orderTickets.filter(t => t.checkedIn && !t.cancelled).length;
    const cancelledCount = orderTickets.filter(t => t.cancelled).length;
    const pendingCount   = orderTickets.length - checkedCount - cancelledCount;

    // Build inner ticket cards HTML (hidden initially)
    let ticketsHtml = '';
    orderTickets.forEach((ticket, idx) => {
      const isCancelled = !!ticket.cancelled;
      const isChecked   = !!ticket.checkedIn && !isCancelled;
      let badgeClass, badgeText;
      if (isCancelled)    { badgeClass = 'badge-cancelled'; badgeText = '🚫 ยกเลิกแล้ว'; }
      else if (isChecked) { badgeClass = 'badge-checked';   badgeText = '✅ เข้างานแล้ว'; }
      else                { badgeClass = 'badge-pending';   badgeText = '⏳ ยังไม่ได้ใช้'; }

      const checkTimeStr = ticket.checkInTime
        ? new Date(ticket.checkInTime).toLocaleString('th-TH', {
            timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit',
            day: '2-digit', month: 'short'
          })
        : '';

      ticketsHtml += `
        <div class="ticket-status-card" id="tsc-${orderId}-${idx}">
          <div class="ticket-card-header">
            <div>
              <div class="ticket-num-label">ใบที่ ${ticket.ticketNum} / ${orderTickets.length}</div>
              <div class="ticket-id-code">${esc(ticket.ticketId)}</div>
            </div>
            <span class="ticket-status-badge ${badgeClass}">${badgeText}${checkTimeStr ? ' · ' + checkTimeStr : ''}</span>
          </div>
          <div class="ticket-card-body">
            ${isCancelled
              ? `<div style="color:#dc2626;font-size:0.9rem;text-align:center;padding:14px;background:rgba(220,38,38,0.08);border-radius:10px;border:1px dashed rgba(220,38,38,0.25);">🚫 บัตรใบนี้ถูกยกเลิกโดยทีมงาน<br/>กรุณาติดต่อเจ้าหน้าที่</div>`
              : `<div class="qr-wrap" id="qr-status-${ticket.ticketId}"></div>
                 <div class="ticket-detail-rows">
                   <div class="ticket-info-row"><span class="tl">การแสดง</span><span class="tv">${esc(ticket.show || 'น่าจะรู้อย่างนี้ตั้งแต่ปี 2475 NO TIME TO BLIND')}</span></div>
                   <div class="ticket-info-row"><span class="tl">รอบแสดง</span><span class="tv">${esc(ticket.showDate || '—')}</span></div>
                   <div class="ticket-info-row"><span class="tl">ประเภทบัตร</span><span class="tv">${esc(ticket.type || '—')}</span></div>
                   <div class="ticket-info-row"><span class="tl">ผู้ถือบัตร</span><span class="tv">${esc(ticket.name || '—')}</span></div>
                 </div>
                 ${(ticket.typeId === 'student' || String(ticket.type).toLowerCase().includes('student'))
                   ? `<div style="font-size:0.78rem;color:#b45309;padding:8px 12px;background:rgba(217,119,6,0.1);border:1px solid rgba(217,119,6,0.25);border-radius:8px;margin:8px 0;text-align:center;line-height:1.4;">⚠️ กรุณานำบัตรนักเรียน นักศึกษามาแสดง ณ จุดลงทะเบียน</div>`
                   : ''}
                  <button class="btn-download-qr" onclick="downloadQR('${esc(ticket.ticketId)}')">📥 ดาวน์โหลด QR Code</button>
                  <button class="btn-regen-qr" onclick="regenerateSingleQR('${esc(ticket.ticketId)}')">🔄 สร้าง QR Code ใหม่อีกครั้ง</button>`
            }
          </div>
        </div>`;
    });

    // Status summary pills
    let statusPills = '';
    if (checkedCount)   statusPills += `<span class="badge-checked ticket-status-badge" style="font-size:0.7rem;padding:2px 8px;">✅ เข้างานแล้ว ${checkedCount}</span> `;
    if (pendingCount)   statusPills += `<span class="badge-pending ticket-status-badge" style="font-size:0.7rem;padding:2px 8px;">⏳ ยังไม่ได้ใช้ ${pendingCount}</span> `;
    if (cancelledCount) statusPills += `<span class="badge-cancelled ticket-status-badge" style="font-size:0.7rem;padding:2px 8px;">🚫 ยกเลิก ${cancelledCount}</span> `;

    html += `
      <div class="order-card" id="order-card-${orderIdx}">

        <!-- Order summary (always visible) -->
        <div class="order-card-header">
          <div class="order-card-top">
            <div>
              <div class="order-card-id">${esc(orderId)}</div>
              <div class="order-card-date">จองเมื่อ ${tsLabel}</div>
            </div>
            <div class="order-ticket-count">🎫 ${orderTickets.length} ใบ</div>
          </div>

          <div class="order-card-rows">
            <div class="order-info-item">
              <div class="oi-label">ชื่อผู้ซื้อ</div>
              <div class="oi-val">${esc(rep.name || '—')}</div>
            </div>
            <div class="order-info-item">
              <div class="oi-label">เบอร์โทร</div>
              <div class="oi-val">${esc(rep.phone || '—')}</div>
            </div>
            <div class="order-info-item">
              <div class="oi-label">ประเภทบัตร</div>
              <div class="oi-val">${esc(rep.type || '—')}</div>
            </div>
            <div class="order-info-item">
              <div class="oi-label">ราคารวม</div>
              <div class="oi-val">${totalAmt ? totalAmt.toLocaleString('th-TH') + ' บาท' : '—'}</div>
            </div>
            <div class="order-info-item" style="grid-column: 1 / -1;">
              <div class="oi-label">รอบแสดง</div>
              <div class="oi-val">${esc(rep.showDate || '—')}</div>
            </div>
          </div>

          ${statusPills ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">${statusPills}</div>` : ''}
        </div>

        <!-- Expand button -->
        <div class="order-card-footer">
          <button class="btn-expand-tickets" id="expand-btn-${orderIdx}"
                  onclick="toggleTickets(${orderIdx}, '${orderId}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
            </svg>
            ดูบัตร ${orderTickets.length} ใบ
            <span class="expand-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </button>
        </div>

        <!-- Tickets panel (expandable) -->
        <div class="tickets-panel" id="tickets-panel-${orderIdx}">
          <div class="tickets-panel-inner">
            <div class="tickets-panel-label">🎫 บัตรในรายการนี้ (${orderTickets.length} ใบ)</div>
            ${ticketsHtml}
          </div>
        </div>

      </div>`;
  });

  resultEl.innerHTML = html;
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ── TOGGLE TICKETS PANEL ── */
function toggleTickets(orderIdx, orderId) {
  const panel  = document.getElementById(`tickets-panel-${orderIdx}`);
  const btn    = document.getElementById(`expand-btn-${orderIdx}`);
  const isOpen = panel.classList.contains('open');

  if (isOpen) {
    panel.classList.remove('open');
    btn.classList.remove('open');
    btn.querySelector('span:last-child').innerHTML =
      `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>`;
  } else {
    panel.classList.add('open');
    btn.classList.add('open');
    btn.querySelector('span:last-child').innerHTML =
      `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>`;

    // Generate QR codes only when first opened
    if (!panel.dataset.rendered) {
      panel.dataset.rendered = '1';
      const allTickets = JSON.parse(localStorage.getItem('theater_tickets') || '{}');
      const orderTickets = Object.values(allTickets)
        .filter(t => t.orderId === orderId && !t.cancelled)
        .sort((a, b) => a.ticketNum - b.ticketNum);

      orderTickets.forEach((ticket, idx) => {
        setTimeout(() => makeQR(`qr-status-${ticket.ticketId}`, ticket.ticketId, 170), idx * 60);
      });
    }

    // Scroll to panel
    setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
  }
}

/* ── QR GENERATOR ── */
function makeQR(elementId, text, size) {
  const el = document.getElementById(elementId);
  if (!el) return;
  el.innerHTML = '';
  try {
    new QRCode(el, {
      text,
      width: size * 2,
      height: size * 2,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
    const canvas = el.querySelector('canvas');
    const img    = el.querySelector('img');
    if (canvas) { 
      canvas.style.borderRadius = '4px'; 
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
    }
    if (img) { 
      img.style.borderRadius = '4px'; 
      img.style.width = size + 'px';
      img.style.height = size + 'px';
    }
  } catch(e) {
    el.innerHTML = `<div style="width:${size}px;height:${size}px;background:#f3f4f6;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:12px">QR Error</div>`;
  }
}

// ─── GENERATE DOWNLOADABLE TICKET IMAGE (WARM RETRO POSTER THEME) ──────────
function generateTicketImageCanvas(ticket, qrCanvas, totalQty) {
  const tc  = document.createElement('canvas');
  tc.width  = 440;
  tc.height = 560;
  const ctx = tc.getContext('2d');

  function drawRoundRect(c, x, y, w, h, r, fill, stroke) {
    c.beginPath();
    if (c.roundRect) {
      c.roundRect(x, y, w, h, r);
    } else {
      c.rect(x, y, w, h);
    }
    if (fill) c.fill();
    if (stroke) c.stroke();
  }

  // 1. Background: Warm cream poster paper
  ctx.fillStyle = '#fbf8f1';
  ctx.fillRect(0, 0, tc.width, tc.height);

  // 2. Ticket Card Box
  const cardX = 16, cardY = 16, cardW = tc.width - 32, cardH = tc.height - 32;
  ctx.fillStyle   = '#ffffff';
  ctx.strokeStyle = '#286b6e';
  ctx.lineWidth   = 2;
  drawRoundRect(ctx, cardX, cardY, cardW, cardH, 20, true, true);

  // 3. Inner Decorative Border
  ctx.strokeStyle = 'rgba(200, 62, 41, 0.25)';
  ctx.lineWidth   = 1;
  drawRoundRect(ctx, cardX + 5, cardY + 5, cardW - 10, cardH - 10, 16, false, true);

  // 4. Top Accent Ribbon (Terracotta -> Coral -> Vintage Teal)
  const grad = ctx.createLinearGradient(cardX + 6, cardY + 6, cardX + cardW - 6, cardY + 6);
  grad.addColorStop(0, '#c83e29');
  grad.addColorStop(0.4, '#e06d44');
  grad.addColorStop(1, '#286b6e');
  ctx.fillStyle = grad;
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(cardX + 6, cardY + 6, cardW - 12, 8, [12, 12, 0, 0]);
    ctx.fill();
  } else {
    ctx.fillRect(cardX + 6, cardY + 6, cardW - 12, 8);
  }

  // 5. Header Titles
  ctx.fillStyle  = '#1c1917';
  ctx.font       = 'bold 18px "Sarabun", sans-serif';
  ctx.textAlign  = 'center';
  ctx.fillText('น่าจะรู้อย่างนี้ตั้งแต่ปี 2475', tc.width / 2, cardY + 42);

  ctx.fillStyle  = '#286b6e';
  ctx.font       = 'bold 13px "Sarabun", sans-serif';
  ctx.fillText('NO TIME TO BLIND', tc.width / 2, cardY + 62);

  // 6. Dotted Line Divider
  ctx.strokeStyle = 'rgba(40, 107, 110, 0.22)';
  ctx.lineWidth   = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(cardX + 24, cardY + 74);
  ctx.lineTo(cardX + cardW - 24, cardY + 74);
  ctx.stroke();
  ctx.setLineDash([]); // Reset line dash

  // 7. QR Code Box (Crisp White with subtle frame)
  const qrSize     = 180;
  const boxPadding = 12;
  const boxSize    = qrSize + boxPadding * 2;
  const boxX       = (tc.width - boxSize) / 2;
  const boxY       = cardY + 86;

  ctx.fillStyle   = '#ffffff';
  ctx.strokeStyle = 'rgba(40, 107, 110, 0.22)';
  ctx.lineWidth   = 1.5;
  drawRoundRect(ctx, boxX, boxY, boxSize, boxSize, 14, true, true);

  if (qrCanvas) {
    ctx.drawImage(qrCanvas, (tc.width - qrSize) / 2, boxY + boxPadding, qrSize, qrSize);
  }

  // 8. Customer Name
  ctx.fillStyle = '#1c1917';
  ctx.font      = 'bold 17px "Sarabun", sans-serif';
  ctx.fillText(ticket.name || 'ผู้ถือบัตร', tc.width / 2, boxY + boxSize + 28);

  // 9. Ticket Type & Number Badge (Pill)
  const qtyStr    = totalQty ? ` / ${totalQty}` : '';
  const typeLabel = `${ticket.type} · ใบที่ ${ticket.ticketNum}${qtyStr}`;
  ctx.font        = 'bold 12px "Sarabun", sans-serif';
  const pillW     = ctx.measureText(typeLabel).width + 24;
  const pillH     = 24;
  const pillX     = (tc.width - pillW) / 2;
  const pillY     = boxY + boxSize + 40;

  ctx.fillStyle   = 'rgba(200, 62, 41, 0.09)';
  ctx.strokeStyle = 'rgba(200, 62, 41, 0.3)';
  ctx.lineWidth   = 1;
  drawRoundRect(ctx, pillX, pillY, pillW, pillH, 12, true, true);

  ctx.fillStyle = '#c83e29';
  ctx.fillText(typeLabel, tc.width / 2, pillY + 16);

  // 10. Show Date & Time
  if (ticket.showDate) {
    ctx.fillStyle = '#286b6e';
    ctx.font      = 'bold 14px "Sarabun", sans-serif';
    ctx.fillText(`📅 ${ticket.showDate}`, tc.width / 2, pillY + 45);
  }

  // 11. Ticket ID Code
  ctx.fillStyle = '#78716c';
  ctx.font      = '600 11px monospace';
  ctx.fillText(ticket.ticketId, tc.width / 2, pillY + 66);

  // 12. Venue
  ctx.fillStyle = '#44403c';
  ctx.font      = '11px "Sarabun", sans-serif';
  ctx.fillText('📍 KINJAI CONTEMPORARY (MRT สิรินธร)', tc.width / 2, pillY + 87);

  // 13. Student Reminder or Entrance Check-in Note
  if (ticket.typeId === 'student' || String(ticket.type).toLowerCase().includes('student')) {
    ctx.fillStyle = '#b45309';
    ctx.font      = '600 10px "Sarabun", sans-serif';
    ctx.fillText('* กรุณานำบัตรนักเรียน/นักศึกษามาแสดง ณ จุดลงทะเบียน', tc.width / 2, pillY + 107);
    ctx.fillStyle = '#a8a29e';
    ctx.font      = '10px "Sarabun", sans-serif';
    ctx.fillText('โปรดแสดง QR Code นี้ที่หน้างานเพื่อเช็คอินเข้าชมการแสดง', tc.width / 2, pillY + 122);
  } else {
    ctx.fillStyle = '#a8a29e';
    ctx.font      = '10px "Sarabun", sans-serif';
    ctx.fillText('โปรดแสดง QR Code นี้ที่หน้างานเพื่อเช็คอินเข้าชมการแสดง', tc.width / 2, pillY + 109);
  }

  return tc;
}

/* ── DOWNLOAD QR ── */
function downloadQR(ticketId) {
  const allTickets = JSON.parse(localStorage.getItem('theater_tickets') || '{}');
  const ticket = Object.values(allTickets).find(t => t.ticketId === ticketId);
  if (!ticket) return;

  const qrEl     = document.getElementById(`qr-status-${ticketId}`);
  const qrCanvas = qrEl?.querySelector('canvas');

  const allOrders = JSON.parse(localStorage.getItem('theater_orders') || '[]');
  const order     = allOrders.find(o => o.orderId === ticket.orderId);
  const totalQty  = order?.qty || order?.tickets?.length || '';

  const tc = generateTicketImageCanvas(ticket, qrCanvas, totalQty);

  const link = document.createElement('a');
  link.download = `ticket-${ticketId}.png`;
  link.href = tc.toDataURL('image/png');
  link.click();
}

function regenerateSingleQR(ticketId) {
  const allTickets = JSON.parse(localStorage.getItem('theater_tickets') || '{}');
  const ticket = Object.values(allTickets).find(t => t.ticketId === ticketId);
  if (!ticket) return;

  makeQR(`qr-status-${ticketId}`, ticketId, 170);
  showToast('🔄 สร้าง QR Code บัตรใบนี้ใหม่อีกครั้งแล้วครับ!', 'success');
}

function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.className   = `toast ${type} show`;
  setTimeout(() => { toast.className = 'toast'; }, 3500);
}

/* ── ESCAPE HTML ── */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── AUTO-SEARCH from URL param ── */
document.addEventListener('DOMContentLoaded', () => {
  const params  = new URLSearchParams(window.location.search);
  const orderId = params.get('order');
  if (orderId) {
    switchTab('order');
    document.getElementById('input-order').value = orderId;
    doSearch();
  } else {
    document.getElementById('input-phone').focus();
  }
});
</script>
<!-- ===================== TOAST ===================== -->
<div id="toast" class="toast"></div>
</body>
</html>
